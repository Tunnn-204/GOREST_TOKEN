name: Automated API Testing
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - run: npm install -g newman newman-reporter-htmlextra
      - run: |
          newman run 2474802010427_HuynhTheTung_GoRest.postman_collection.json \
            -e 2474802010427_HuynhTheTung_GoRest_Env.postman_environment.json \
            -d users.csv \
            --env-var "token=${{ secrets.GOREST_TOKEN }}"
