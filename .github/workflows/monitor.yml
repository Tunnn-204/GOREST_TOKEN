name: Monitor API Health
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - run: |
          RES=$(curl -s -w "\n%{http_code}:%{time_total}" "https://gorest.co.in/public/v2/users")
          HTTP=$(echo "$RES" | tail -n1 | cut -d':' -f1)
          TIME=$(echo "$RES" | tail -n1 | cut -d':' -f2)
          MS=$(awk "BEGIN {print int($TIME * 1000)}")
          echo "Status: $HTTP, Time: ${MS}ms"
          if [ "$HTTP" -ne 200 ] || [ "$MS" -ge 800 ]; then exit 1; fi
